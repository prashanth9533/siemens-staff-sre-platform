apiVersion: v1
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: Siemens SRE Dashboards
        orgId: 1
        folder: Siemens SRE
        type: file
        disableDeletion: true
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: observability
