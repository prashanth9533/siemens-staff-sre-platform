apiVersion: v1
data:
  prometheus-datasource.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
        editable: false
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
