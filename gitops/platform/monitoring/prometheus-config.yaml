apiVersion: v1
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: sample-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - sample-api.sample-api.svc.cluster.local:80
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
