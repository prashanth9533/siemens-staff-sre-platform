apiVersion: v1
data:
  alerts.yml: |
    groups:
      - name: sample-api-alerts
        rules:
          - alert: SampleApiDown
            expr: count(up{job="sample-api"} == 1) < 2
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Sample API pod is unavailable"
              description: "Prometheus cannot scrape the sample API pod {{ $labels.pod }}."

          - alert: HighApiErrorRate
            expr: |
              100 *
              (
                (sum(rate(sample_api_requests_total{status=~"5.."}[5m])) or vector(0))
                /
                clamp_min(sum(rate(sample_api_requests_total[5m])), 1)
              ) > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Sample API error rate is above 5%"
              description: "The API error rate has exceeded 5% for 5 minutes."

          - alert: HighApiP95Latency
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(sample_api_request_duration_seconds_bucket[5m])
                )
              ) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Sample API P95 latency is high"
              description: "API P95 latency has exceeded 500 milliseconds for 5 minutes."
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: sample-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - sample-api

        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: sample-api

          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running

          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

        metrics_path: /metrics
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
